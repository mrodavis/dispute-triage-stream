apiVersion: v1
kind: ConfigMap
metadata:
  name: dispute-triage
data:
  KAFKA_BROKERS: kafka-bootstrap.kafka.svc.cluster.local:9092
  KAFKA_GROUP: dispute-triage
  GRPC_ADDR: ":9090"
  TRIAGE_MODEL: claude-sonnet-5-5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispute-triage
  labels: { app: dispute-triage }
spec:
  # Consumers in one group share partitions, so replicas scale up to the partition count (3).
  # Run more than one replica only with a shared store (Postgres) so idempotency holds across pods.
  replicas: 1
  selector:
    matchLabels: { app: dispute-triage }
  template:
    metadata:
      labels: { app: dispute-triage }
    spec:
      terminationGracePeriodSeconds: 30 # time to finish the batch, commit, and leave the group
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: triage
          image: ghcr.io/mrodavis/dispute-triage-stream:latest
          ports:
            - { name: grpc, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: dispute-triage }
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: dispute-triage, key: anthropic-api-key, optional: true } }
            - name: REVIEW_TOKENS
              valueFrom: { secretKeyRef: { name: dispute-triage, key: review-tokens } }
          readinessProbe:
            grpc: { port: 9090 }
            periodSeconds: 10
          livenessProbe:
            grpc: { port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: dispute-triage
spec:
  selector: { app: dispute-triage }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dispute-triage
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: dispute-triage }
