name: CI
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests (Kafka tests run against an in-process broker)
        run: go test -race ./...
      - name: Eval (fails if a fraud claim, an injection attempt or a wrong auto-credit slips through)
        run: go run ./cmd/eval
      - name: Container image builds
        run: docker build -t dispute-triage .

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r analytics/spark/requirements.txt
      - run: cd analytics/spark && python -m pytest -q

  integration:
    # Real Apache Kafka: the Go service writes the topics, then the Spark job reads them.
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go service against Kafka
        env: { KAFKA_BROKERS: "localhost:9092" }
        run: go test -tags=integration -run Real -count=1 -v ./internal/pipeline
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r analytics/spark/requirements.txt
      - name: Spark reads the topics the Go service wrote
        run: |
          spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1 \
            analytics/spark/triage_metrics.py --source kafka --brokers localhost:9092 --out /tmp/metrics
          python analytics/spark/check_output.py /tmp/metrics
